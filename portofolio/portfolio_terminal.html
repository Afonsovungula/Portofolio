
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; }
  #terminal {
    background: #0d0d0d;
    border: 1px solid #1a3a1a;
    border-radius: 10px;
    font-family: 'Courier New', monospace;
    min-height: 520px;
    max-height: 520px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,255,70,0.08);
  }
  .titlebar {
    background: #111;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #1a3a1a;
    flex-shrink: 0;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #ffbd2e; }
  .dot.g { background: #28c840; }
  .title-text { color: #3a7a3a; font-size: 12px; margin-left: 8px; letter-spacing: 1px; }
  #output {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    font-size: 13px;
    color: #00cc44;
    line-height: 1.6;
    scrollbar-width: thin;
    scrollbar-color: #1a4a1a #0d0d0d;
  }
  #output::-webkit-scrollbar { width: 4px; }
  #output::-webkit-scrollbar-track { background: #0d0d0d; }
  #output::-webkit-scrollbar-thumb { background: #1a4a1a; }
  .line { margin: 2px 0; white-space: pre-wrap; word-break: break-word; }
  .prompt { color: #00ff55; }
  .cmd { color: #ffffff; }
  .output-text { color: #00cc44; }
  .error { color: #ff4444; }
  .highlight { color: #00ff88; font-weight: bold; }
  .muted { color: #3a6a3a; }
  .tag { color: #88ff88; }
  .link { color: #44aaff; cursor: pointer; text-decoration: underline; }
  .section-title { color: #00ff88; border-bottom: 1px solid #1a3a1a; padding-bottom: 2px; margin: 4px 0 6px; }
  #input-row {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-top: 1px solid #1a3a1a;
    background: #0d0d0d;
    flex-shrink: 0;
  }
  .input-prompt { color: #00ff55; font-family: 'Courier New', monospace; font-size: 13px; white-space: nowrap; }
  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    caret-color: #00ff55;
    margin-left: 6px;
  }
  .blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>

<div id="terminal">
  <div class="titlebar">
    <div class="dot r"></div>
    <div class="dot y"></div>
    <div class="dot g"></div>
    <span class="title-text">AFONSO D. VUNGULA — PORTFOLIO v1.0</span>
  </div>
  <div id="output"></div>
  <div id="input-row">
    <span class="input-prompt">visitor@portfolio:~$</span>
    <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" placeholder="digite um comando..." />
  </div>
</div>

<script>
const out = document.getElementById('output');
const inp = document.getElementById('cmd-input');

const data = {
  about: [
    '╔══════════════════════════════════════╗',
    '║         AFONSO D. VUNGULA           ║',
    '║      Fullstack Developer            ║',
    '╚══════════════════════════════════════╝',
    '',
    '  Nome    →  Afonso D. Vungula',
    '  Role    →  Fullstack Developer',
    '  Base    →  Luanda, Angola',
    '  Foco    →  Mobile & Web Apps',
    '',
    '  Apaixonado por criar soluções reais para',
    '  problemas reais. Atualmente a construir o',
    '  AgroSabi — uma app de assistência agrícola',
    '  para agricultores em Angola.',
  ],
  skills: [
    '  ┌─ FRONTEND ─────────────────────┐',
    '  │  React Native · Expo · TypeScript│',
    '  │  React.js · HTML · CSS · JS     │',
    '  └─────────────────────────────────┘',
    '  ┌─ BACKEND ──────────────────────┐',
    '  │  Node.js · Express · REST API  │',
    '  │  MySQL · Railway               │',
    '  └─────────────────────────────────┘',
    '  ┌─ FERRAMENTAS ──────────────────┐',
    '  │  Git · GitHub · Codespaces     │',
    '  │  Postman · VS Code             │',
    '  └─────────────────────────────────┘',
    '  ┌─ AI / INTEGRAÇÃO ──────────────┐',
    '  │  Groq SDK · LLaMA · LLaVA      │',
    '  │  API Integration               │',
    '  └─────────────────────────────────┘',
  ],
  projects: [
    '  ┌─ AGROSABI ─────────────────────────────────┐',
    '  │  App de assistência agrícola para Angola   │',
    '  │  Stack: React Native · Node.js · MySQL     │',
    '  │  Features: AgroChat (IA) · Deteção pragas  │',
    '  │           · Cronograma · Planejamento      │',
    '  │  Status: Em desenvolvimento ativo          │',
    '  └────────────────────────────────────────────┘',
    '',
    '  ┌─ PORTFOLIO TERMINAL ───────────────────────┐',
    '  │  Portfolio interativo estilo terminal      │',
    '  │  Stack: HTML · CSS · JavaScript            │',
    '  │  Status: Concluído                         │',
    '  └────────────────────────────────────────────┘',
  ],
  social: [
    '  ┌─ REDES SOCIAIS ─────────────────┐',
    '  │                                 │',
    '  │  GitHub   →  github.com/afonso  │',
    '  │  LinkedIn →  linkedin.com/in/   │',
    '  │             afonso-vungula      │',
    '  │  Instagram→  @afonso.dev        │',
    '  │                                 │',
    '  └─────────────────────────────────┘',
  ],
  contact: [
    '  ┌─ CONTACTO ──────────────────────┐',
    '  │                                 │',
    '  │  Email  →  afonso@email.com     │',
    '  │  WhatsApp → +244 9XX XXX XXX   │',
    '  │  Luanda, Angola                 │',
    '  │                                 │',
    '  │  Disponível para freelance      │',
    '  │  e projetos colaborativos       │',
    '  │                                 │',
    '  └─────────────────────────────────┘',
  ]
};

const help_text = [
  '  Comandos disponíveis:',
  '',
  '  about      →  Quem é Afonso',
  '  skills     →  Stack técnico',
  '  projects   →  Projetos desenvolvidos',
  '  social     →  Redes sociais',
  '  contact    →  Entrar em contacto',
  '  clear      →  Limpar terminal',
  '  help       →  Ver esta lista',
  '',
  '  Dica: tente também "hello" ;)',
];

const boot = [
  ' █████╗  ███████╗ ██████╗ ███╗  ██╗███████╗ ██████╗ ',
  '██╔══██╗ ██╔════╝██╔═══██╗████╗ ██║██╔════╝██╔═══██╗',
  '███████║ █████╗  ██║   ██║██╔██╗██║███████╗██║   ██║',
  '██╔══██║ ██╔══╝  ██║   ██║██║╚████║╚════██║██║   ██║',
  '██║  ██║ ██║     ╚██████╔╝██║ ╚███║███████║╚██████╔╝',
  '╚═╝  ╚═╝ ╚═╝      ╚═════╝ ╚═╝  ╚══╝╚══════╝ ╚═════╝ ',
  '',
  '  Fullstack Developer · Luanda, Angola',
  '  ─────────────────────────────────────',
  '  Sistema iniciado. Digite "help" para ver os comandos.',
  '',
];

let history = [];
let histIdx = -1;

function print(lines, cls='output-text') {
  lines.forEach(l => {
    const d = document.createElement('div');
    d.className = 'line ' + cls;
    d.textContent = l;
    out.appendChild(d);
  });
  out.scrollTop = out.scrollHeight;
}

function printBoot() {
  let i = 0;
  function next() {
    if (i < boot.length) {
      const d = document.createElement('div');
      d.className = 'line highlight';
      d.textContent = boot[i];
      out.appendChild(d);
      out.scrollTop = out.scrollHeight;
      i++;
      setTimeout(next, 40);
    }
  }
  next();
}

function printCmd(cmd) {
  const d = document.createElement('div');
  d.className = 'line';
  d.innerHTML = '<span class="prompt">visitor@portfolio:~$</span> <span class="cmd">' + escHtml(cmd) + '</span>';
  out.appendChild(d);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function run(cmd) {
  const c = cmd.trim().toLowerCase();
  printCmd(cmd);
  if (!c) return;
  history.unshift(cmd); histIdx = -1;

  if (c === 'clear') { out.innerHTML = ''; return; }
  if (c === 'help') { print(help_text); return; }
  if (c === 'about') { print(data.about); return; }
  if (c === 'skills') { print(data.skills); return; }
  if (c === 'projects') { print(data.projects); return; }
  if (c === 'social') { print(data.social); return; }
  if (c === 'contact') { print(data.contact); return; }
  if (c === 'hello' || c === 'oi' || c === 'hi') {
    print(['  Olá! Bem-vindo ao meu portfolio.', '  Digite "help" para explorar. 👾']);
    return;
  }
  print(['  Comando não reconhecido: "' + cmd + '"', '  Digite "help" para ver os comandos disponíveis.'], 'error');
}

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = inp.value;
    inp.value = '';
    run(v);
  } else if (e.key === 'ArrowUp') {
    if (histIdx < history.length - 1) { histIdx++; inp.value = history[histIdx]; }
    e.preventDefault();
  } else if (e.key === 'ArrowDown') {
    if (histIdx > 0) { histIdx--; inp.value = history[histIdx]; }
    else { histIdx = -1; inp.value = ''; }
    e.preventDefault();
  }
});

document.getElementById('terminal').addEventListener('click', () => inp.focus());
printBoot();
inp.focus();
</script>
